name: Publish TS4 as the TS3 update
on:
  push:
    tags:
      - "ts4-redirect-*"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the TS4 installer
        run: |
          curl -fL -o TreeChopSim4-Setup.exe https://github.com/trickortree/treesim4/releases/latest/download/TreeChopSim4-Setup.exe
          ls -l TreeChopSim4-Setup.exe
      - name: Write latest.yml
        run: |
          SIZE=$(stat -c%s TreeChopSim4-Setup.exe)
          SHA=$(openssl dgst -sha512 -binary TreeChopSim4-Setup.exe | openssl base64 -A)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          cat > latest.yml <<EOF
          version: 1.3.1
          files:
            - url: TreeChopSim4-Setup.exe
              sha512: $SHA
              size: $SIZE
          path: TreeChopSim4-Setup.exe
          sha512: $SHA
          releaseDate: '$NOW'
          EOF
          cat latest.yml
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Hypergamous Tree Chopping Simulator 4 is OUT!

          Press UPDATE to download and install TS4. TS3 stays installed on your PC, so nothing is lost.
          TS3 is finished and will not get more updates. See you in the new woods.
          EOF
          gh release create v1.3.1 TreeChopSim4-Setup.exe latest.yml --repo "$GITHUB_REPOSITORY" --target main --title "TS4 is out!" --notes-file notes.md
